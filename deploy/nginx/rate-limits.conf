# Rate-limit ZONES — these must live in the http {} context.
# Install by copying to /etc/nginx/conf.d/yugenbd-rate-limits.conf
# (files in conf.d are auto-included inside http {} on Ubuntu/Debian nginx).
#
# Defense-in-depth: the Express app already rate-limits; these add a network
# edge limit so abusive bursts never even reach Node.

# General admin-UI browsing limit (per-IP).
limit_req_zone $binary_remote_addr zone=admin_ui:10m rate=20r/s;

# Auth/login + review-submit are the sensitive API paths — tighter.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=30r/m;
