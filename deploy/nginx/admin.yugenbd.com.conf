# Admin dashboard (Next.js) — hTdQ8yNsC3r.yugenbd.com  ->  127.0.0.1:3001
# Install: /etc/nginx/sites-available/admin.yugenbd.com.conf
# Requires deploy/nginx/rate-limits.conf.
#
# ⚠️ SECURITY: the subdomain "hTdQ8yNsC3r" is a slice of the ADMIN2 password
# (Wf4!hTdQ8yNsC3r). TLS certs publish every subdomain to public Certificate
# Transparency logs, so a secret-derived hostname leaks part of that password.
# STRONGLY recommended: pick an unrelated random label (openssl rand -hex 8),
# update server_name here + CORS_ORIGIN + this filename, and rotate that
# admin password. Obscuring the URL is not a substitute for the login.

server {
    listen 80;
    listen [::]:80;
    server_name hTdQ8yNsC3r.yugenbd.com;

    gzip on;
    client_max_body_size 15m;

    # Optional hard allowlist: if your admins have static IPs, uncomment and add
    # them — this blocks everyone else before the app even sees the request.
    # allow 203.0.113.10;   # office IP
    # deny all;

    location / {
        limit_req zone=admin_ui burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
