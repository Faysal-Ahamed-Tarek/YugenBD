# Storefront (Next.js) — yugenbd.com + www  ->  127.0.0.1:3000
# Install: /etc/nginx/sites-available/yugenbd.com.conf  (then symlink to sites-enabled)
# Certbot (--nginx) rewrites this to add the :443 block + http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name yugenbd.com www.yugenbd.com;

    # Redirect the www host to the apex (keep one canonical origin for SEO).
    if ($host = www.yugenbd.com) {
        return 301 https://yugenbd.com$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 15m;   # room for image uploads proxied through the app

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
