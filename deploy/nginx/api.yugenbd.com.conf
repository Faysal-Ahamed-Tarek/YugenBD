# API (Express) — api.yugenbd.com  ->  127.0.0.1:4000
# Install: /etc/nginx/sites-available/api.yugenbd.com.conf
# CORS is handled by the Express app (CORS_ORIGIN); do NOT also add CORS headers
# here or browsers will see duplicates. Requires deploy/nginx/rate-limits.conf.

server {
    listen 80;
    listen [::]:80;
    server_name api.yugenbd.com;

    gzip on;
    gzip_types application/json;
    client_max_body_size 15m;   # image/video uploads to Cloudinary pass through here

    # Tight limit on login (brute-force protection at the edge).
    location = /api/v1/auth/login {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public write endpoint (guest review submit) — moderate limit.
    location = /api/v1/reviews {
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
